<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetManager — Ingresar</title>
  <meta name="description" content="Sistema de gestión para veterinarias. Iniciá sesión para acceder.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🐾</div>
      <div>
        <div style="font-size:1.3rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">VetManager</div>
        <div style="font-size:0.72rem;color:var(--txt3);">Sistema de Gestión Veterinaria</div>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login" onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="login-email" type="email" class="form-control" placeholder="veterinaria@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input id="login-pass" type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div id="login-error" style="display:none;" class="alert alert-danger"></div>
      <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
        Ingresar
      </button>
    </form>
    <p style="font-size:0.75rem;text-align:center;color:var(--txt3);margin-top:16px;">
      🔒 El acceso es gestionado por el administrador del sistema.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const errEl = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  errEl.style.display = 'none';
  try {
    await login(
      document.getElementById('login-email').value,
      document.getElementById('login-pass').value
    );
  } catch (err) {
    errEl.textContent = getFirebaseError(err.code);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

function getFirebaseError(code) {
  const msgs = {
    'auth/user-not-found': 'No existe una cuenta con ese email.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-email': 'Email inválido.',
    'auth/too-many-requests': 'Demasiados intentos. Intentá más tarde.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
  };
  return msgs[code] || 'Error al ingresar. Verificá tus datos.';
}
</script>
</body>
</html>
